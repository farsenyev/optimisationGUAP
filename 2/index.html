<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Метод Кубической Интерполяции с Chart.js</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
    canvas {
      height: 100%;
      width: 100%;
      margin: 20px auto;
    }
  </style>
</head>
<body>
<h1>Метод Кубической Интерполяции для максимизации f(θ)</h1>
<canvas id="myChart"></canvas>

<script>
  // Целевая функция: f(θ) = 2 - cosθ + √3 sinθ
  function f(theta) {
    return 2 - Math.cos(theta) + Math.sqrt(3) * Math.sin(theta);
  }

  // Метод кубической интерполяции для максимизации f(θ)
  function cubicInterpolation(maxIter = 50, tol = 0.01) {
    // Начальные точки: θ1, θ2, θ3
    let theta1 = 1.0;  // левая граница
    let theta2 = 2.0;  // центральная точка (ближе к экстремуму)
    let theta3 = 3.0;  // правая граница
    let iterPoints = [theta1, theta2, theta3];

    for (let i = 0; i < maxIter; i++) {
      const f1 = f(theta1);
      const f2 = f(theta2);
      const f3 = f(theta3);
      // Формула кубической интерполяции:
      const num = Math.pow(theta2 - theta1, 2) * (f2 - f3) - Math.pow(theta2 - theta3, 2) * (f2 - f1);
      const den = (theta2 - theta1) * (f2 - f3) - (theta2 - theta3) * (f2 - f1);
      if (Math.abs(den) < 1e-8) break; // защита от деления на ноль

      const thetaNew = theta2 - 0.5 * (num / den);
      iterPoints.push(thetaNew);

      // Собираем имеющиеся точки и сортируем их по возрастанию θ
      let pts = [
        { theta: theta1, f: f1 },
        { theta: theta2, f: f2 },
        { theta: theta3, f: f3 },
        { theta: thetaNew, f: f(thetaNew) }
      ];
      pts.sort((a, b) => a.theta - b.theta);

      // Находим точку с максимальным значением f
      const maxPoint = pts.reduce((prev, curr) => (curr.f > prev.f ? curr : prev));
      const idxMax = pts.findIndex(pt => pt.theta === maxPoint.theta);
      // Обновляем набор так, чтобы максимум оказался в центре
      if (idxMax === 0) {
        pts = pts.slice(0, 3);
      } else if (idxMax === pts.length - 1) {
        pts = pts.slice(pts.length - 3);
      } else {
        pts = pts.slice(idxMax - 1, idxMax + 2);
      }

      theta1 = pts[0].theta;
      theta2 = pts[1].theta;
      theta3 = pts[2].theta;

      if (Math.abs(thetaNew - theta2) < tol) {
        theta2 = thetaNew;
        break;
      }
    }
    return { thetaOpt: theta2, fOpt: f(theta2), iterPoints };
  }

  // Вычисляем оптимальное значение и итерационные точки
  const result = cubicInterpolation(50, 0.01);
  console.log("Оптимальный угол θ:", result.thetaOpt);
  console.log("Максимальное значение f(θ):", result.fOpt);
  console.log("Максимальное BD =", Math.sqrt(result.fOpt)); // f(θ) = BD²
  console.log("Итерационные точки:", result.iterPoints);

  // Подготавливаем данные для графика функции f(θ) на интервале [0.5, 3.5]
  const thetaMin = 0.5;
  const thetaMax = 3.5;
  let functionData = [];
  const sampleCount = 400;
  for (let i = 0; i <= sampleCount; i++) {
    let theta = thetaMin + (thetaMax - thetaMin) * i / sampleCount;
    functionData.push({ x: theta, y: f(theta) });
  }

  // Итерационные точки для отображения
  let iterData = result.iterPoints.map(theta => ({ x: theta, y: f(theta) }));

  // Оптимальная точка
  let optData = [{ x: result.thetaOpt, y: f(result.thetaOpt) }];

  // Конфигурация графика с использованием Chart.js
  const ctx = document.getElementById('myChart').getContext('2d');
  const myChart = new Chart(ctx, {
    type: 'line',
    data: {
      datasets: [
        {
          label: 'f(θ)',
          data: functionData,
          borderColor: 'blue',
          backgroundColor: 'rgba(0,0,255,0.1)',
          fill: false,
          pointRadius: 0, // не отображаем точки для функции
          tension: 0.2,
        },
        {
          label: 'Итерационные точки',
          data: iterData,
          borderColor: 'red',
          backgroundColor: 'red',
          showLine: true,
          pointRadius: 5,
          pointStyle: 'circle',
          fill: false,
          tension: 0,
        },
        {
          label: 'Оптимальная точка',
          data: optData,
          borderColor: 'green',
          backgroundColor: 'green',
          showLine: false,
          pointRadius: 7,
          pointStyle: 'rectRot',
          fill: false,
        }
      ]
    },
    options: {
      scales: {
        x: {
          type: 'linear',
          position: 'bottom',
          title: {
            display: true,
            text: 'θ (рад)'
          },
          min: thetaMin,
          max: thetaMax
        },
        y: {
          title: {
            display: true,
            text: 'f(θ)'
          }
        }
      },
      plugins: {
        title: {
          display: true,
          text: 'Метод Кубической Интерполяции для Максимизации f(θ)'
        }
      }
    }
  });
</script>
</body>
</html>
