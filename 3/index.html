<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Контурный график с Chart.js</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    canvas {
      height: 100%;
      width: 100%;
      margin: 0 auto;
    }
  </style>
</head>
<body>
<h2>Контурный график целевой функции и итерации оптимизации</h2>
<canvas id="chart" width="600" height="400"></canvas>

<script>
  // Целевая функция F(x1, x2) = 3*x1 - x1*x2 + 2*x2 - 4
  function F(x1, x2) {
    return 3 * x1 - x1 * x2 + 2 * x2 - 4;
  }

  // Задаем диапазоны переменных
  const x1Min = 0, x1Max = 4;
  const x2Min = 2, x2Max = 4;
  const numPoints = 50; // количество точек на оси

  // Формируем равномерную сетку и вычисляем F для каждой точки
  let gridData = [];
  for (let i = 0; i < numPoints; i++) {
    let x1 = x1Min + (x1Max - x1Min) * i / (numPoints - 1);
    for (let j = 0; j < numPoints; j++) {
      let x2 = x2Min + (x2Max - x2Min) * j / (numPoints - 1);
      let z = F(x1, x2);
      gridData.push({ x: x1, y: x2, z: z });
    }
  }

  // Пример итерационных точек, полученных в ходе численной оптимизации
  const iterPoints = [
    { x: 2.0, y: 3.0 },    // исходная точка
    { x: 1.5, y: 3.2 },
    { x: 1.0, y: 3.6 },
    { x: 0.5, y: 3.8 },
    { x: 0.0, y: 4.0 }     // найденный оптимум
  ];

  // Подготавливаем датасеты для Chart.js

  // 1. Датасет для итерационных точек (соединенные линией)
  const iterDataset = {
    label: 'Итерационные точки',
    data: iterPoints,
    type: 'scatter',
    pointRadius: 3,
    borderColor: 'green',
    backgroundColor: 'green',
    showLine: true,
    fill: false
  };

  // 2. Датасет для оптимума
  const optimumDataset = {
    label: 'Оптимум',
    data: [{ x: 0.0, y: 4.0 }],
    type: 'scatter',
    pointRadius: 7,
    backgroundColor: 'black',
    borderColor: 'black',
  };

  const data = {
    datasets: [iterDataset, optimumDataset]
  };

  const config = {
    type: 'scatter',
    data: data,
    options: {
      plugins: {
        tooltip: {
          callbacks: {}
        }
      },
      scales: {
        x: {
          type: 'linear',
          position: 'bottom',
          title: { display: true, text: 'x1' },
          min: -2,
          max: 5
        },
        y: {
          title: { display: true, text: 'x2' },
          min: 0,
          max: 5
        }
      }
    }
  };

  // Создаем график
  const ctx = document.getElementById('chart').getContext('2d');
  new Chart(ctx, config);
</script>
</body>
</html>
