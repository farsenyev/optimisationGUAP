<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>График функции BD(θ)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<canvas id="myChart" width="800" height="400"></canvas>
<script>
  // Перевод градусов в радианы
  function toRadians(degrees) {
    return degrees * Math.PI / 180;
  }

  // Функция для вычисления BD по формуле
  function BD(a, b, thetaDegrees) {
    const theta = toRadians(thetaDegrees);
    const term = a * a + b * b + a * b - 2 * a * b * Math.cos(theta + toRadians(60));
    return Math.sqrt(term);
  }

  // Заданные длины отрезков
  const a = 3;
  const b = 4;

  // Массивы для хранения значений угла и соответствующих значений BD
  let thetaValues = [];
  let BDValues = [];
  for (let theta = 0; theta <= 180; theta += 0.5) {
    thetaValues.push(theta);
    BDValues.push(BD(a, b, theta));
  }

  // Нахождение максимума
  let maxBD = 0;
  let bestTheta = 0;
  for (let i = 0; i < thetaValues.length; i++) {
    if (BDValues[i] > maxBD) {
      maxBD = BDValues[i];
      bestTheta = thetaValues[i];
    }
  }

  // Построение графика с использованием Chart.js
  const ctx = document.getElementById('myChart').getContext('2d');
  const data = {
    labels: thetaValues,
    datasets: [{
      label: 'BD(α)',
      data: BDValues,
      borderColor: 'blue',
      fill: false,
    },
      {
        // Отображаем только точку экстремума
        label: 'Максимум',
        data: thetaValues.map(theta => (Math.abs(theta - bestTheta) < 0.001 ? maxBD : null)),
        borderColor: 'red',
        pointRadius: 8,
        showLine: false,
      }]
  };
  const config = {
    type: 'line',
    data: data,
    options: {
      scales: {
        x: { title: { display: true, text: 'α (градусы)' } },
        y: { title: { display: true, text: 'BD' } }
      }
    }
  };
  new Chart(ctx, config);
</script>
</body>
</html>
